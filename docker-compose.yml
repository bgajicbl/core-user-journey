services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-please-override-in-real-deployments}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/courses > /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
