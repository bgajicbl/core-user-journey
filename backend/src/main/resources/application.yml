spring:
  application:
    name: core-user-journey-backend
  datasource:
    url: jdbc:h2:mem:cuj;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
  h2:
    console:
      # off by default: nothing in this app depends on it, and leaving a DB console enabled
      # unconditionally is a real-world misconfiguration class, not just a theoretical one.
      # Flip to true locally (never in the shipped image) if you need to poke at the H2 DB.
      enabled: false
      path: /h2-console

server:
  port: 8080

app:
  jwt:
    # demo-only secret; fine for a mocked, non-production auth flow
    secret: ${JWT_SECRET:change-me-super-secret-key-for-core-user-journey-demo-please-override}
    expiration-minutes: 1440
