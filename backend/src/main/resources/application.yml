spring:
  application:
    name: core-user-journey-backend
  datasource:
    url: jdbc:h2:mem:cuj;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

app:
  jwt:
    # demo-only secret; fine for a mocked, non-production auth flow
    secret: ${JWT_SECRET:change-me-super-secret-key-for-core-user-journey-demo-please-override}
    expiration-minutes: 1440
